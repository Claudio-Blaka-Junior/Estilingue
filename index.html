<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilingue FPS - Tiro ao Alvo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        canvas { display: block; }
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; }
        #score { font-size: 28px; font-weight: bold; color: #ffdd00; }
        #stats { margin-top: 10px; color: #ffffff; font-size: 16px; }
        #stats span { color: #ff6b6b; }
        #instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; font-size: 16px; text-align: center; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,0.8); }
        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #crosshair::after { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair .dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff4444; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 5px #ff0000; }
        #gameOver { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 40px 60px; border-radius: 20px; text-align: center; z-index: 20; border: 3px solid #ffdd00; }
        #gameOver h1 { font-size: 48px; color: #ff4444; margin-bottom: 20px; }
        #gameOver p { font-size: 24px; margin-bottom: 20px; }
        #gameOver button { padding: 15px 40px; font-size: 20px; background: #ffdd00; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        #hitMarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 60px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 15; text-shadow: 0 0 10px #ff0000; }
        #hitMarker.hit-glass { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; color: #fff; }
        #startScreen h1 { font-size: 64px; margin-bottom: 20px; color: #ffdd00; text-shadow: 0 0 20px rgba(255, 221, 0, 0.5); }
        #startScreen p { font-size: 20px; margin-bottom: 15px; color: #aaa; }
        #startScreen .targets-info { display: flex; gap: 30px; margin: 20px 0 30px; font-size: 16px; }
        #startScreen .targets-info div { padding: 10px 20px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        #startScreen button { padding: 20px 60px; font-size: 24px; background: #ffdd00; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        #startScreen button:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 221, 0, 0.6); }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>🎯 ESTILINGUE FPS</h1>
        <p>Atire nas latas e garrafas de vidro!</p>
        <div class="targets-info">
            <div>🥫 Lata = 100 pts</div>
            <div>🍾 Garrafa = 150 pts</div>
        </div>
        <p style="font-size: 16px;">Mouse: Mirar | Clique: Atirar | WASD: Mover</p>
        <button onclick="startGame()">JOGAR</button>
    </div>

    <div id="hud">
        <div id="score">Pontos: 0</div>
        <div id="stats">
            🥫 Latas: <span id="cansHit">0</span> | 
            🍾 Garrafas: <span id="bottlesHit">0</span>
        </div>
    </div>

    <div id="crosshair"><div class="dot"></div></div>
    <div id="hitMarker">✕</div>

    <div id="instructions">
        🎯 Clique para atirar | WASD para mover | Mouse para mirar
    </div>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Pontuação Final: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let score = 0, cansHit = 0, bottlesHit = 0;
        let gameActive = false;
        let targets = [], projectiles = [], particles = [], glassShards = [];
        let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let targetSpawnTimer = 0, maxTargets = 10;
        let slingshotGroup, bandLeft, bandRight, pouch;
        let bandLeftRest, bandRightRest;
        let slingshotPulling = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 8);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(20, 30, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ color: 0x3a7d3a, roughness: 0.8 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createSky();
            createFences();
            createSlingshot();

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onResize);
        }

        function createSky() {
            const skyMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x0077ff) },
                    bottomColor: { value: new THREE.Color(0xffffff) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `varying vec3 vWorldPosition; void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPosition = wp.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition + offset).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0); }`,
                side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 32), skyMaterial));
        }

        function createFences() {
            const fenceMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            for (let i = -20; i <= 20; i += 4) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3, 0.3), fenceMaterial);
                post.position.set(i, 1.5, -30);
                post.castShadow = true;
                scene.add(post);
            }
            const railGeom = new THREE.BoxGeometry(42, 0.3, 0.3);
            for (let y of [1, 2.5]) {
                const rail = new THREE.Mesh(railGeom, fenceMaterial);
                rail.position.set(0, y, -30);
                rail.castShadow = true;
                scene.add(rail);
            }
        }

        // ===== ESTILINGUE (MENOR) =====
        function createSlingshot() {
            slingshotGroup = new THREE.Group();

            const woodMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x6b3410, roughness: 0.8, metalness: 0.1
            });

            // Cabo principal
            const handle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.06, 0.45, 12),
                woodMaterial
            );
            handle.position.set(0, -0.3, 0);
            handle.castShadow = true;
            slingshotGroup.add(handle);

            // Nó central
            const knot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), woodMaterial);
            knot.position.set(0, -0.08, 0);
            knot.castShadow = true;
            slingshotGroup.add(knot);

            // Braço esquerdo
            const leftArmPoints = [];
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                leftArmPoints.push(new THREE.Vector3(-0.04 - t * 0.18, -0.08 + t * 0.38, -t * 0.04));
            }
            const leftArm = new THREE.Mesh(
                new THREE.TubeGeometry(new THREE.CatmullRomCurve3(leftArmPoints), 10, 0.035, 8, false),
                woodMaterial
            );
            leftArm.castShadow = true;
            slingshotGroup.add(leftArm);

            // Braço direito
            const rightArmPoints = [];
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                rightArmPoints.push(new THREE.Vector3(0.04 + t * 0.18, -0.08 + t * 0.38, -t * 0.04));
            }
            const rightArm = new THREE.Mesh(
                new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rightArmPoints), 10, 0.035, 8, false),
                woodMaterial
            );
            rightArm.castShadow = true;
            slingshotGroup.add(rightArm);

            // Bandas elásticas
            const bandMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B0000, roughness: 0.6, metalness: 0.1
            });
            const bandGeom = new THREE.CylinderGeometry(0.012, 0.012, 1, 6);
            bandLeft = new THREE.Mesh(bandGeom, bandMaterial);
            bandRight = new THREE.Mesh(bandGeom, bandMaterial);
            slingshotGroup.add(bandLeft);
            slingshotGroup.add(bandRight);

            // Bolsa
            pouch = new THREE.Mesh(
                new THREE.SphereGeometry(0.045, 12, 12, 0, Math.PI * 2, 0, Math.PI),
                new THREE.MeshStandardMaterial({ color: 0x4a2a0a, roughness: 0.9, side: THREE.DoubleSide })
            );
            pouch.position.set(0, 0.22, 0);
            pouch.castShadow = true;
            slingshotGroup.add(pouch);

            bandLeftRest = new THREE.Vector3(-0.22, 0.30, -0.04);
            bandRightRest = new THREE.Vector3(0.22, 0.30, -0.04);

            // Posição MENOR e mais próxima
            slingshotGroup.position.set(0.22, -0.22, -0.5);
            slingshotGroup.rotation.set(0.1, -0.2, 0.15);
            slingshotGroup.scale.set(0.6, 0.6, 0.6);

            camera.add(slingshotGroup);
            scene.add(camera);
        }

        function updateSlingshotBands() {
            if (!bandLeft || !bandRight || !pouch) return;
            const pouchPos = pouch.position.clone();
            
            const leftStart = bandLeftRest.clone();
            const leftDir = new THREE.Vector3().subVectors(pouchPos, leftStart);
            const leftLength = leftDir.length();
            bandLeft.position.copy(leftStart.clone().add(pouchPos).multiplyScalar(0.5));
            bandLeft.scale.set(1, leftLength, 1);
            bandLeft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), leftDir.normalize());
            
            const rightStart = bandRightRest.clone();
            const rightDir = new THREE.Vector3().subVectors(pouchPos, rightStart);
            const rightLength = rightDir.length();
            bandRight.position.copy(rightStart.clone().add(pouchPos).multiplyScalar(0.5));
            bandRight.scale.set(1, rightLength, 1);
            bandRight.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), rightDir.normalize());
        }

        // ===== ALVOS =====
        function createCan() {
            const canGroup = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.35, 1, 16),
                new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 })
            );
            body.castShadow = true;
            canGroup.add(body);

            const topMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.9, roughness: 0.2 });
            const top = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.05, 16), topMat);
            top.position.y = 0.5;
            top.castShadow = true;
            canGroup.add(top);

            const bottom = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.05, 16), topMat);
            bottom.position.y = -0.5;
            bottom.castShadow = true;
            canGroup.add(bottom);

            const label = new THREE.Mesh(
                new THREE.CylinderGeometry(0.355, 0.355, 0.6, 16, 1, true),
                new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.3, roughness: 0.5, side: THREE.DoubleSide })
            );
            canGroup.add(label);

            const detail = new THREE.Mesh(
                new THREE.CylinderGeometry(0.36, 0.36, 0.15, 16, 1, true),
                new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.5, side: THREE.DoubleSide })
            );
            detail.position.y = 0.1;
            canGroup.add(detail);

            canGroup.userData.type = 'can';
            canGroup.userData.points = 100;
            return canGroup;
        }

        function createBottle() {
            const bottleGroup = new THREE.Group();

            // VIDRO MENOS TRANSPARENTE (correção)
            const glassMaterial = new THREE.MeshPhysicalMaterial({ 
                color: 0x1f6b3a,
                metalness: 0.1,
                roughness: 0.15,
                transmission: 0.45,
                thickness: 1.2,
                transparent: true,
                opacity: 0.95,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                ior: 1.5,
                reflectivity: 0.5
            });

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16), glassMaterial);
            body.position.y = -0.25;
            body.castShadow = true;
            bottleGroup.add(body);

            const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.15, 0.3, 16), glassMaterial);
            shoulder.position.y = 0.3;
            shoulder.castShadow = true;
            bottleGroup.add(shoulder);

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.35, 12), glassMaterial);
            neck.position.y = 0.6;
            neck.castShadow = true;
            bottleGroup.add(neck);

            const mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.08, 12), glassMaterial);
            mouth.position.y = 0.82;
            mouth.castShadow = true;
            bottleGroup.add(mouth);

            const cap = new THREE.Mesh(
                new THREE.CylinderGeometry(0.13, 0.13, 0.06, 12),
                new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9, roughness: 0.2 })
            );
            cap.position.y = 0.88;
            cap.castShadow = true;
            bottleGroup.add(cap);

            const label = new THREE.Mesh(
                new THREE.CylinderGeometry(0.305, 0.305, 0.3, 16, 1, true),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, side: THREE.DoubleSide })
            );
            label.position.y = -0.2;
            bottleGroup.add(label);

            bottleGroup.userData.type = 'bottle';
            bottleGroup.userData.points = 150;
            return bottleGroup;
        }

        function spawnTarget() {
            if (targets.length >= maxTargets) return;
            const isBottle = Math.random() < 0.5;
            const target = isBottle ? createBottle() : createCan();
            const x = (Math.random() - 0.5) * 20;
            const z = -10 - Math.random() * 15;
            const y = isBottle ? 1.0 : 0.5;

            target.position.set(x, y, z);
            target.userData.health = 1;
            target.userData.originalY = y;
            target.userData.floatOffset = Math.random() * Math.PI * 2;
            target.userData.rotationSpeed = (Math.random() - 0.5) * 1.5;
            scene.add(target);
            targets.push(target);
        }

        // ===== PROJÉTEIS =====
        function createProjectile(startPos, dir) {
            const projectile = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 10, 10),
                new THREE.MeshStandardMaterial({ 
                    color: 0x555555, metalness: 0.8, roughness: 0.3,
                    emissive: 0x222222, emissiveIntensity: 0.3
                })
            );
            projectile.position.copy(startPos);
            projectile.castShadow = true;
            projectile.userData = {
                velocity: dir.clone().normalize().multiplyScalar(60),
                life: 3,
                startPos: startPos.clone()
            };
            scene.add(projectile);
            projectiles.push(projectile);
        }

        function createImpactParticles(pos, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 4, 4),
                    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
                );
                particle.position.copy(pos);
                const a1 = Math.random() * Math.PI * 2;
                const a2 = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 6;
                particle.userData = {
                    velocity: new THREE.Vector3(
                        Math.sin(a1) * Math.cos(a2) * speed,
                        Math.abs(Math.sin(a2)) * speed + 2,
                        Math.cos(a1) * Math.cos(a2) * speed
                    ),
                    life: 0.8 + Math.random() * 0.5,
                    maxLife: 0.8 + Math.random() * 0.5
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function createGlassShards(pos) {
            for (let i = 0; i < 20; i++) {
                const geom = new THREE.BufferGeometry();
                const vertices = new Float32Array([
                    0, 0, 0,
                    0.1 + Math.random() * 0.1, 0, 0,
                    0.05, 0.1 + Math.random() * 0.1, 0
                ]);
                geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                geom.computeVertexNormals();

                // CACOS MENOS TRANSPARENTES (correção)
                const mat = new THREE.MeshPhysicalMaterial({
                    color: 0x1f6b3a,
                    metalness: 0.1,
                    roughness: 0.15,
                    transmission: 0.4,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.DoubleSide
                });
                
                const shard = new THREE.Mesh(geom, mat);
                shard.position.copy(pos);
                const a1 = Math.random() * Math.PI * 2;
                const a2 = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 8;
                shard.userData = {
                    velocity: new THREE.Vector3(
                        Math.sin(a1) * Math.cos(a2) * speed,
                        Math.abs(Math.sin(a2)) * speed + 3,
                        Math.cos(a1) * Math.cos(a2) * speed
                    ),
                    angularVelocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    ),
                    life: 1.5 + Math.random() * 0.5,
                    maxLife: 1.5 + Math.random() * 0.5
                };
                scene.add(shard);
                glassShards.push(shard);
            }
        }

        // ===== CONTROLES =====
        function onMouseMove(event) {
            if (document.pointerLockElement === renderer.domElement) {
                targetMouseX -= event.movementX * 0.002;
                targetMouseY -= event.movementY * 0.002;
                targetMouseY = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, targetMouseY));
            } else {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                targetMouseX = -mouseX * 0.8;
                targetMouseY = mouseY * 0.5;
            }
        }

        function onMouseDown(event) {
            if (!gameActive) return;
            if (event.button === 0) {
                slingshotPulling = true;
                if (pouch) pouch.position.set(0, 0.1, 0.12);
            }
        }

        function onMouseUp(event) {
            if (!gameActive) return;
            if (event.button === 0 && slingshotPulling) {
                shoot();
                slingshotPulling = false;
                if (pouch) pouch.position.set(0, 0.22, 0);
            }
        }

        function shoot() {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const startPos = new THREE.Vector3();
            if (pouch) pouch.getWorldPosition(startPos);
            else startPos.copy(camera.position);
            startPos.add(dir.clone().multiplyScalar(0.3));
            createProjectile(startPos, dir);

            if (slingshotGroup) {
                slingshotGroup.rotation.x = 0.3;
                setTimeout(() => {
                    if (slingshotGroup) slingshotGroup.rotation.x = 0.1;
                }, 100);
            }
        }

        function onKeyDown(event) {
            switch(event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Escape': if (gameActive) document.exitPointerLock(); break;
            }
        }

        function onKeyUp(event) {
            switch(event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===== COLISÕES =====
        function checkCollisions() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                let hit = false;
                for (let j = targets.length - 1; j >= 0; j--) {
                    const target = targets[j];
                    const dist = proj.position.distanceTo(target.position);
                    const hitRadius = target.userData.type === 'bottle' ? 0.6 : 0.7;
                    if (dist < hitRadius) {
                        const isGlass = target.userData.type === 'bottle';
                        const targetPos = target.position.clone();
                        if (isGlass) {
                            createGlassShards(targetPos);
                            createImpactParticles(targetPos, 0x88ffcc, 10);
                            bottlesHit++;
                        } else {
                            createImpactParticles(targetPos, 0xffdd00, 15);
                            cansHit++;
                        }
                        score += target.userData.points;
                        updateScore();
                        showHitMarker(isGlass);
                        scene.remove(target);
                        targets.splice(j, 1);
                        hit = true;
                        break;
                    }
                }
                if (hit || proj.userData.life <= 0 || proj.position.distanceTo(proj.userData.startPos) > 300) {
                    scene.remove(proj);
                    proj.geometry.dispose();
                    proj.material.dispose();
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.userData.velocity.y -= 15 * delta;
                proj.position.addScaledVector(proj.userData.velocity, delta);
                proj.userData.life -= delta;
                if (proj.userData.life <= 0 || proj.position.y < -1) {
                    scene.remove(proj);
                    proj.geometry.dispose();
                    proj.material.dispose();
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.velocity.y -= 12 * delta;
                p.position.addScaledVector(p.userData.velocity, delta);
                p.userData.life -= delta;
                const opacity = Math.max(0, p.userData.life / p.userData.maxLife);
                p.material.opacity = opacity;
                p.scale.setScalar(opacity);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        function updateGlassShards(delta) {
            for (let i = glassShards.length - 1; i >= 0; i--) {
                const shard = glassShards[i];
                shard.userData.velocity.y -= 20 * delta;
                shard.position.addScaledVector(shard.userData.velocity, delta);
                shard.rotation.x += shard.userData.angularVelocity.x * delta;
                shard.rotation.y += shard.userData.angularVelocity.y * delta;
                shard.rotation.z += shard.userData.angularVelocity.z * delta;
                shard.userData.life -= delta;
                if (shard.position.y < 0.02) {
                    shard.position.y = 0.02;
                    shard.userData.velocity.y *= -0.4;
                    shard.userData.velocity.x *= 0.7;
                    shard.userData.velocity.z *= 0.7;
                }
                const opacity = Math.max(0, shard.userData.life / shard.userData.maxLife);
                shard.material.opacity = opacity * 0.9;
                if (shard.userData.life <= 0) {
                    scene.remove(shard);
                    shard.geometry.dispose();
                    shard.material.dispose();
                    glassShards.splice(i, 1);
                }
            }
        }

        function updateTargets(delta) {
            const time = Date.now() * 0.001;
            for (const target of targets) {
                target.position.y = target.userData.originalY + Math.sin(time * 2 + target.userData.floatOffset) * 0.05;
                target.rotation.y += delta * target.userData.rotationSpeed;
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = 'Pontos: ' + score;
            document.getElementById('cansHit').textContent = cansHit;
            document.getElementById('bottlesHit').textContent = bottlesHit;
        }

        function showHitMarker(isGlass = false) {
            const marker = document.getElementById('hitMarker');
            marker.classList.toggle('hit-glass', isGlass);
            marker.textContent = isGlass ? '💥' : '✕';
            marker.style.opacity = '1';
            setTimeout(() => { marker.style.opacity = '0'; }, 200);
        }

        function updateMovement(delta) {
            const speed = 8;
            velocity.x -= velocity.x * 10 * delta;
            velocity.z -= velocity.z * 10 * delta;
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta * 10;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta * 10;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0; right.normalize();
            camera.position.addScaledVector(forward, -velocity.z * delta);
            camera.position.addScaledVector(right, -velocity.x * delta);
            camera.position.x = Math.max(-25, Math.min(25, camera.position.x));
            camera.position.z = Math.max(-20, Math.min(15, camera.position.z));
            camera.position.y = 1.7;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(0.05, 0.016);
            if (!gameActive) { renderer.render(scene, camera); return; }

            mouseX += (targetMouseX - mouseX) * 0.3;
            mouseY += (targetMouseY - mouseY) * 0.3;
            camera.rotation.y = mouseX;
            camera.rotation.x = mouseY;

            updateMovement(delta);
            updateProjectiles(delta);
            updateParticles(delta);
            updateGlassShards(delta);
            updateTargets(delta);
            updateSlingshotBands();
            checkCollisions();

            targetSpawnTimer += delta;
            if (targetSpawnTimer > 1.5 && targets.length < maxTargets) {
                spawnTarget();
                targetSpawnTimer = 0;
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameActive = true;
            score = 0; cansHit = 0; bottlesHit = 0;
            updateScore();
            for (const target of targets) scene.remove(target);
            targets = [];
            for (let i = 0; i < 6; i++) spawnTarget();
            mouseX = 0; mouseY = 0; targetMouseX = 0; targetMouseY = 0;
            renderer.domElement.requestPointerLock();
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }

        init();
        animate();
    </script>
</body>
</html>
